name: Build Metadata and Create PR

on:
  workflow_dispatch:  # Permite que o fluxo de trabalho seja acionado manualmente

permissions:
  contents: read

concurrency:
  group: metadata-update-test
  cancel-in-progress: false

jobs:
  run-script-and-create-pr:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout do repositório
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Configurar Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # Step 3: Instalar dependências (se houver)
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Step 4: Executar o script Python
      - name: Run metadata generator script
        run: |
          python scripts/metadata-generator.py

      # Step 5: Checkout do segundo repositório para criar a PR
      - name: Checkout target repository
        uses: actions/checkout@v3
        with:
          repository: Chrystinne/pr-metadata-generator
          path: pr-repo
          ref: main
          token: ${{ secrets.MY_PERSONAL_TOKEN }}

      # Step 6: Copiar a pasta datasets para o repositório de destino
      - name: Copy datasets to target repo
        run: |
          test -n "$(find datasets -maxdepth 1 -name '*.yaml' -print -quit)"
          mkdir -p pr-repo/datasets
          cp datasets/*.yaml pr-repo/datasets/
          git -C pr-repo add -f -- datasets/*.yaml

      - name: Checkout AWS registry validators
        uses: actions/checkout@v3
        with:
          repository: awslabs/open-data-registry
          ref: main
          path: registry-validation
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          python -m venv "$RUNNER_TEMP/registry-venv"
          "$RUNNER_TEMP/registry-venv/bin/python" -m pip install \
            -r registry-validation/requirements.txt PyYAML 'ruamel.yaml<0.18'

      - name: Validate candidate datasets before creating PR
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/registry-venv/bin:$PATH"
          validation_dir=$(mktemp -d "$RUNNER_TEMP/odr-check.XXXXXX")
          cp registry-validation/{schema.yaml,ext.py,tags.yaml,adx_categories.yaml,resources.yaml,services.yaml} "$validation_dir/"
          cp -R registry-validation/_scripts "$validation_dir/"
          cp -R pr-repo/datasets "$validation_dir/"
          cd "$validation_dir"
          git init -q
          git config user.name "Metadata validation"
          git config user.email "metadata-validation@users.noreply.github.com"
          git add datasets
          git -c core.hooksPath=/dev/null commit -q -m "Temporary validation snapshot"
          bash _scripts/add_metadata.sh
          # Some versions of test.sh return nonzero even for passing files.
          result=0
          bash _scripts/test.sh > validation.log 2>&1 || result=$?
          cat validation.log
          if grep -q "failed validation" validation.log; then
            exit 1
          fi
          if [ "$result" -ne 0 ]; then
            exit "$result"
          fi

      # A action gerencia a branch, o commit, o push e o PR
      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.MY_PERSONAL_TOKEN }}
          path: pr-repo
          add-paths: datasets/*.yaml
          commit-message: "Add datasets from metadata generator"
          branch: metadata-update-branch
          base: main
          title: "Metadata update from Python script"
          body: "This PR contains generated dataset metadata validated with the AWS Open Data Registry schema and _scripts/test.sh."
